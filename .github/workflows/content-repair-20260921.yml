name: Verify and publish requested page fixes once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/content-repair-20260921.yml']
permissions:
  contents: read
concurrency:
  group: owner-requested-page-content-repair
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'NosytLabs/who-up-north' && github.event.head_commit.message == 'ops: verify and publish requested page fixes once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pages: read
    steps:
      - name: Disable this one-time helper before proceeding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/disable"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply only hash-verified, locally tested page edits
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          spec = json.loads(Path('.github/content-repair-20260921.json').read_text())
          allowed = {'index.html', 'src/main.js', 'README.md', 'docs/SOURCES_AND_COMPLIANCE.md'}
          assert set(spec['files']) == allowed
          def blob(text):
              data = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          files = {name: Path(name).read_text() for name in allowed}
          for name, text in files.items():
              assert blob(text) == spec['files'][name]['before'], 'Source advanced: ' + name
          for edit in spec['edits']:
              name = edit['path']
              assert name in allowed and files[name].count(edit['old']) == 1
              files[name] = files[name].replace(edit['old'], edit['new'])
          for name, text in files.items():
              assert blob(text) == spec['files'][name]['after'], 'Output mismatch: ' + name
          for name, text in files.items():
              Path(name).write_text(text)
          print('All four page/source files match the locally tested target hashes.')
          PY
      - name: Full repository check, including all regression tests
        run: npm run check
      - name: Commit verified content without overwriting concurrent work
        run: |
          git diff --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add -- index.html src/main.js README.md docs/SOURCES_AND_COMPLIANCE.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(pages): correct stale data labels, release calendar and shared time offsets [skip ci]'
          git push origin HEAD:refs/heads/main
          echo "REPAIRED_CONTENT_SHA=$(git rev-parse HEAD)"
      - name: Refresh official public data without paid AI
        env:
          AI_GATEWAY_API_KEY: ''
        run: |
          node scripts/refresh-data.mjs
          node scripts/generate-jev-fact.mjs
      - name: Verify generated data and build static pages
        run: |
          npm run check
          npm run build
          git rev-parse HEAD > dist/content-revision.txt
      - name: Check existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type == "workflow"' | grep -qx true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
