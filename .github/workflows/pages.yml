name: refresh-and-deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install optional Jev dependency
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        shell: bash
        run: |
          if [ -n "${AI_GATEWAY_API_KEY}" ]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "AI_GATEWAY_API_KEY not configured; deterministic fact mode needs no npm dependencies."
          fi

      - name: Refresh official Canadian data
        run: node scripts/refresh-data.mjs

      - name: Generate Jev fact selector output
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: node scripts/generate-jev-fact.mjs

      - name: Verify data model and static architecture
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          if ! status="$(curl -sS --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-max-time 60 -o "${response}" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"; then
            echo "::error title=Pages API connection failed::Unable to verify deployment settings. The built site artifact is retained; retry after the connection recovers."
            exit 1
          fi

          case "${status}" in
            200)
              if ! node --input-type=commonjs -e 'const fs = require("node:fs"); const settings = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (settings.build_type !== "workflow") process.exit(1);' "${response}"; then
                echo "::error title=Invalid Pages configuration::The API response must describe a GitHub Actions Pages source. Open Settings > Pages > Build and deployment and select GitHub Actions."
                exit 1
              fi
              ;;
            404)
              echo "::error title=GitHub Pages setup required::Open Settings > Pages > Build and deployment and select GitHub Actions, then rerun this workflow. The normal GITHUB_TOKEN cannot enable Pages. The built site artifact is retained."
              exit 1
              ;;
            401|403)
              echo "::error title=Pages API access denied::GitHub returned HTTP ${status}. Check token permissions, repository access and any API rate-limit restrictions; this is not proof that Pages is disabled."
              exit 1
              ;;
            *)
              echo "::error title=Pages API request failed::GitHub returned HTTP ${status}. Deployment settings could not be verified; retry after resolving the API error."
              exit 1
              ;;
          esac
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

  deploy:
    if: needs.build.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
