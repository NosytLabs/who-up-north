name: Temporary live SEO validation

on:
  push:
    branches:
      - seo-live-cleanup-2026-09-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-live-cleanup-2026-09-25
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: npm run build
