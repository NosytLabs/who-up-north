name: Publish clipboard repair once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-clipboard-repair-once.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-one-time-clipboard-repair
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify source regression suite
        run: npm run check
      - name: Reuse last verified Pages data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf previous dist
          mkdir -p previous dist
          gh run download 35570956088 -n github-pages -D previous
          tar -xf previous/artifact.tar -C dist
          test -f dist/data/live-signals.json
          cp src/main.js dist/src/main.js
          node --check dist/src/main.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          retention-days: 1
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
