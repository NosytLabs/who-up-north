name: Clipboard fallback verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-clipboard-fallback-run.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
