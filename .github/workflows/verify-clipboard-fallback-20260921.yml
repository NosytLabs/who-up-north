name: Verify clipboard fallback once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-clipboard-fallback-20260921.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: owner-requested-clipboard-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.head_commit.message == 'ops: verify clipboard fallback once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable this one-time helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run check
      - run: npm run build
