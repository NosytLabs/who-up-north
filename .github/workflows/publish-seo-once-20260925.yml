name: Publish SEO fixes once 2026-09-25

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - public/robots.txt
      - public/sitemap.xml
      - scripts/tests/seo.test.mjs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-seo-fixes-2026-09-25
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify static site
        run: npm run check
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
